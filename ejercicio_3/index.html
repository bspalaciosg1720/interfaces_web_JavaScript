<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Notas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Sistema de Notas</h1>
        <p>Calcula la nota definitiva del estudiante</p>
        <form id="formularioNotas">
            <label for="nombre">Nombre del estudiante</label>
            <input type="text" id="nombre" placeholder="Ej: Brayan Palacios">
            <label for="nota1">Nota 1</label>
            <input type="number" id="nota1" step="0.1" min="0" max="5" placeholder="Ej: 4.0">
            <label for="nota2">Nota 2</label>
            <input type="number" id="nota2" step="0.1" min="0" max="5" placeholder="Ej: 3.5">
            <label for="nota3">Nota 3</label>
            <input type="number" id="nota3" step="0.1" min="0" max="5" placeholder="Ej: 4.2">
            <button type="submit">Calcular nota</button>
        </form>
        <div id="resultado"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
