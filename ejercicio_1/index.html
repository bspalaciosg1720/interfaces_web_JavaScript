<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Registro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Formulario de Registro</h1>
        <p>Ingresa tus datos personales</p>
        <form id="formulario">
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" placeholder="Ej: Brayan Palacios">
            <label for="edad">Edad</label>
            <input type="number" id="edad" placeholder="Ej: 25">
            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" placeholder="Ej: correo@gmail.com">
            <label for="ciudad">Ciudad</label>
            <input type="text" id="ciudad" placeholder="Ej: Bogotá">
            <button type="submit">Registrar</button>
        </form>
        <div id="resultado"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
