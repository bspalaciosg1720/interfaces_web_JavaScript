<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Compra</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="contenedor">
        <h1>Calculadora de Compra</h1>
        <p>Ingresa los datos de la compra</p>
        <form id="formularioCompra">
            <label for="producto">Producto</label>
            <input type="text" id="producto" placeholder="Ej: Hamburguesa">
            <label for="precio">Precio</label>
            <input type="number" id="precio" placeholder="Ej: 15000">
            <label for="cantidad">Cantidad</label>
            <input type="number" id="cantidad" placeholder="Ej: 3">
            <label for="descuento">Descuento (%)</label>
            <input type="number" id="descuento" placeholder="Ej: 10">
            <button type="submit">Calcular</button>
        </form>
        <div id="resultado"></div>
    </div>
    <script src="script.js"></script>
</body>
</html>
